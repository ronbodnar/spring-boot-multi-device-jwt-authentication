app:
  name: Auth Service
  security:
    password-reset-url: http://localhost:8080/api/v1/auth/reset-password
    jwt-secret: ${JWT_SECRET}
    jwt:
      secret: ${JWT_SECRET}
      access-token:
        name: app_access
        expiration: 5m
      refresh-token:
        name: app_refresh
        expiration: 7d

server:
  port: 8080

spring:
  config:
    import: file:./env.properties

  application:
    name: JWT Auth Service

  jpa:
    hibernate:
      ddl-auto: create
    show-sql: false
    database-platform: org.hibernate.dialect.H2Dialect

  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: root
    password: password

logging:
  file:
    name: logs/auth-service.log

  level:
    root: INFO
    org.springframework.security: DEBUG
